name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify importability and version
        run: |
          python -c "import kr6_kinematics; print('imported version', kr6_kinematics.__version__)"

      - name: Run pytest
        run: python -m pytest -ra --cov=kr6_kinematics --cov-report=term-missing tests/

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff
        run: ruff check kr6_kinematics scripts tests

  smoke-scripts:
    name: Smoke-test driver scripts
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Configure non-interactive matplotlib backend
        run: echo "MPLBACKEND=Agg" >> $GITHUB_ENV

      - name: Run robot_spec (text-only)
        run: python scripts/robot_spec.py

      - name: Run dh_frames (DH frames figure)
        run: python scripts/dh_frames.py

      - name: Run forward_kinematics
        run: python scripts/forward_kinematics.py

      - name: Run inverse_kinematics (closed-form IK)
        run: python scripts/inverse_kinematics.py
